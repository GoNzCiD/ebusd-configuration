# Pegar en una automatización nueva de la UI, en Editar en YAML.
# Nombre: Aerothermal noise reduction schedule week sync
# El id tiene que quedar en automation.aerothermal_noise_reduction_schedule_week_sync
alias: Aerothermal noise reduction schedule week sync
description: Pone el interruptor semanal según la última lectura de los 7 días. No escribe en el bus. Mientras un script está leyendo o escribiendo el horario, espera a que termine.
mode: restart
triggers:
  - trigger: state
    entity_id:
      - input_text.aerothermal_noise_reduction_schedule_monday
      - input_text.aerothermal_noise_reduction_schedule_tuesday
      - input_text.aerothermal_noise_reduction_schedule_wednesday
      - input_text.aerothermal_noise_reduction_schedule_thursday
      - input_text.aerothermal_noise_reduction_schedule_friday
      - input_text.aerothermal_noise_reduction_schedule_saturday
      - input_text.aerothermal_noise_reduction_schedule_sunday
  - trigger: state
    entity_id:
      - script.aerothermal_noise_reduction_schedule_refresh
      - script.aerothermal_noise_reduction_schedule_apply
      - script.aerothermal_noise_reduction_schedule_week_activate
      - script.aerothermal_noise_reduction_schedule_week_deactivate
    from: "on"
    to: "off"
conditions:
  - condition: state
    entity_id:
      - script.aerothermal_noise_reduction_schedule_refresh
      - script.aerothermal_noise_reduction_schedule_apply
      - script.aerothermal_noise_reduction_schedule_week_activate
      - script.aerothermal_noise_reduction_schedule_week_deactivate
    state: "off"
actions:
  - variables:
      vacios:
        - "—"
        - sin franja
        - unknown
        - unavailable
        - ""
      textos:
        - "{{ states('input_text.aerothermal_noise_reduction_schedule_monday') }}"
        - "{{ states('input_text.aerothermal_noise_reduction_schedule_tuesday') }}"
        - "{{ states('input_text.aerothermal_noise_reduction_schedule_wednesday') }}"
        - "{{ states('input_text.aerothermal_noise_reduction_schedule_thursday') }}"
        - "{{ states('input_text.aerothermal_noise_reduction_schedule_friday') }}"
        - "{{ states('input_text.aerothermal_noise_reduction_schedule_saturday') }}"
        - "{{ states('input_text.aerothermal_noise_reduction_schedule_sunday') }}"
      hay_franjas: "{{ (textos | reject('in', vacios) | list | count) > 0 }}"
  - if:
      - condition: template
        value_template: "{{ hay_franjas | bool }}"
      - condition: state
        entity_id: input_boolean.aerothermal_noise_reduction_schedule_week_active
        state: "off"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.aerothermal_noise_reduction_schedule_week_active
  - if:
      - condition: template
        value_template: "{{ not (hay_franjas | bool) }}"
      - condition: state
        entity_id: input_boolean.aerothermal_noise_reduction_schedule_week_active
        state: "on"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.aerothermal_noise_reduction_schedule_week_active
